<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Tau Arnisador</title>
    <style>
      :root {
        --tau-bg: #f1f1f1;
        --tau-dark: #061b0c;
        --tau-ink: #101810;
        --tau-panel: #ffffff;
        --tau-panel-soft: #f7faf7;
        --tau-lime: #aaff00;
        --tau-lime-dark: #69a900;
        --tau-green-deep: #12632b;
        --tau-text: #101810;
        --tau-muted: #3d4a3b;
        --tau-border: rgba(6, 27, 12, 0.12);
        --tau-shadow: rgba(6, 27, 12, 0.12);
        --tau-placeholder: #6a7e6f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          linear-gradient(90deg, rgba(3, 10, 6, 0.78), rgba(3, 10, 6, 0.7)),
          url("backgroundLOg.jpg") center / cover no-repeat fixed;
        color: var(--tau-text);
      }

      .register-page {
        width: min(100%, 980px);
        padding: 30px 20px;
      }

      .register-card {
        max-width: 760px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--tau-border);
        border-top: 5px solid var(--tau-lime);
        border-radius: 18px;
        box-shadow: 0 12px 28px var(--tau-shadow);
        padding: 32px 28px;
      }

      .hero-banner {
        position: relative;
        height: 190px;
        margin: -32px -28px 28px;
        overflow: hidden;
        border-radius: 17px 17px 0 0;
        background: linear-gradient(135deg, var(--tau-dark), var(--tau-green-deep));
      }

      .hero-banner > img:first-child {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .brand-logo {
        position: absolute;
        left: 24px;
        bottom: 18px;
        width: 88px;
        height: 88px;
        object-fit: contain;
        padding: 8px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      }

      .brand {
        margin-bottom: 12px;
      }

      .tag {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(170, 255, 0, 0.14);
        color: var(--tau-green-deep);
        border: 1px solid rgba(18, 99, 43, 0.18);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: clamp(2rem, 4vw, 3rem);
        color: var(--tau-dark);
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--tau-muted);
        line-height: 1.6;
      }

      form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--tau-dark);
      }

      input,
      select {
        width: 100%;
        padding: 14px 15px;
        border-radius: 12px;
        border: 1px solid var(--tau-border);
        background: var(--tau-panel-soft);
        color: var(--tau-text);
        font-size: 1rem;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      input:focus,
      select:focus {
        border-color: rgba(18, 99, 43, 0.7);
        box-shadow: 0 0 0 3px rgba(170, 255, 0, 0.15);
      }

      input::placeholder {
        color: var(--tau-placeholder);
      }

      .checkbox-row {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        color: var(--tau-muted);
      }

      .checkbox-row input {
        width: 18px;
        height: 18px;
        accent-color: var(--tau-green-deep);
      }

      .btn {
        grid-column: 1 / -1;
        margin-top: 10px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--tau-lime), var(--tau-lime-dark));
        color: var(--tau-dark);
        font-size: 1rem;
        font-weight: 700;
        padding: 16px 20px;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 10px 20px rgba(170, 255, 0, 0.28);
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(170, 255, 0, 0.35);
      }

      .login-link {
        grid-column: 1 / -1;
        text-align: center;
        margin-top: 8px;
        color: var(--tau-muted);
        font-size: 0.95rem;
      }

      .login-link a {
        color: var(--tau-green-deep);
        text-decoration: none;
        font-weight: 600;
      }

      .login-link a:hover {
        text-decoration: underline;
      }

      @media (max-width: 640px) {
        .register-card {
          padding: 24px 18px;
        }

        .hero-banner {
          height: 150px;
          margin: -24px -18px 24px;
        }

        .brand-logo {
          width: 72px;
          height: 72px;
          left: 18px;
          bottom: 12px;
        }

        form {
          grid-template-columns: 1fr;
        }
      }

      body {
        background: url("backgroundLOg.jpg") center / cover no-repeat fixed;
      }
    </style>
  </head>
  <body>
    <main class="register-page">
      <section class="register-card">
        <div class="hero-banner">
          <img src="newbanner2.jpg" alt="Tau Arnisador banner" />
          <img
            class="brand-logo"
            src="arnislogo.jpg"
            alt="Tau Arnisador logo"
          />
        </div>
        <div class="brand">
          <span class="tag">Player Registration</span>
          <h1>Join Tau Arnisador</h1>
        </div>

        <p class="subtitle">
          This is the area where players can join our training community,
          register their details, and start their journey in Arnis.
        </p>

        <form>
          <div class="field">
            <label for="schoolId">School ID</label>
            <input
              id="schoolId"
              type="text"
              placeholder="Enter your school ID"
            />
          </div>

          <div class="field full">
            <label for="fullName">Full Name</label>
            <input
              id="fullName"
              type="text"
              placeholder="Enter your full name"
            />
          </div>

          <div class="field">
            <label for="year">Year</label>
            <input id="year" type="text" placeholder="e.g. 1st Year" />
          </div>

          <div class="field">
            <label for="course">Course</label>
            <input id="course" type="text" placeholder="Enter your course" />
          </div>

          <div class="field">
            <label for="age">Age</label>
            <input
              id="age"
              type="number"
              min="1"
              placeholder="Enter your age"
            />
          </div>

          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender">
              <option value="">Select gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Prefer not to say</option>
              <option>Other</option>
            </select>
          </div>

          <div class="checkbox-row">
            <input id="terms" type="checkbox" />
            <label for="terms">I agree to the terms and conditions.</label>
          </div>

          <button type="submit" class="btn">Create Account</button>

          <div class="login-link">
            Already a member? <a href="arnisadorLOg.html">Login here</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
